name: CI

on:
  push:
    branches: [gh-pages]
    paths:
      - 'src/**'
      - 'test/**'
      - 'play/**'
      - 'mars/**'
      - 'pitch/**'
      - 'empires/**'
      - 'garden/**'
      - 'zelda2mario/**'
      - 'api/**'
      - 'index.html'
      - 'assets/previews/**'
      - 'home.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'offline.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vercel-build
      - run: npm run art:validate
      - run: npm run art:report
      - run: git diff --exit-code -- mars/art/reports/art-validation.json mars/art/reports/artist-test-approval.json mars/art/reports/golden-approval.json
      - run: npm run art:contact-sheet
      - run: git diff --exit-code -- mars/art/reports/golden-contact-sheet.html
      - run: npm run sim
      - run: npx playwright install --with-deps chromium
      - run: npm run art:visual
      - run: npm run smoke:play
      - run: npm run smoke:catalog
      - run: npm run smoke:landing
      - run: npm run smoke:zelda2mario
